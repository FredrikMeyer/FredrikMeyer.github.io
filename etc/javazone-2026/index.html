<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaZone 2026 Planner</title>
    <meta name="description" content="Upcoming JavaZone 2026 sessions with personal interest marking.">
    <meta name="theme-color" content="#f6f2e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="JZ Planner">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="hero__eyebrow">Personal agenda</p>
        <h1>JavaZone 2026 Planner</h1>
        <p class="hero__dek">
          Upcoming sessions only. Times are shown in Oslo so the schedule reads like the conference program.
        </p>
        <div class="hero__counts">
          <div class="hero__count">
            <span class="hero__count-number" id="upcoming-count">0</span>
            <span class="hero__count-label">shown</span>
          </div>
          <div class="hero__count">
            <span class="hero__count-number" id="interested-count">0</span>
            <span class="hero__count-label">marked</span>
          </div>
        </div>
      </header>

      <details class="controls" id="controls-disclosure">
        <summary class="controls__toggle" id="controls-toggle">
          <span class="controls__toggle-label">Search and filters</span>
          <span class="controls__toggle-summary" id="controls-summary">Closed</span>
        </summary>

        <div class="controls__panel" id="controls-panel">
          <label class="search-field">
            <span>Search</span>
            <input id="search-input" type="search" placeholder="Title, speaker, room, keyword">
          </label>

          <div class="filter-row">
            <label>
              <span>Day</span>
              <select id="day-filter">
                <option value="all">All days</option>
              </select>
            </label>

            <label>
              <span>Format</span>
              <select id="format-filter">
                <option value="all">All formats</option>
              </select>
            </label>

            <label>
              <span>Language</span>
              <select id="language-filter">
                <option value="all">All languages</option>
              </select>
            </label>
          </div>

          <label class="toggle-field" for="interested-only">
            <input id="interested-only" type="checkbox">
            <span>Interested only</span>
          </label>
        </div>
      </details>

      <section class="status-panel" aria-live="polite">
        <p id="status-message">Loading upcoming sessions...</p>
        <p id="sync-message"></p>
      </section>

      <section id="schedule" class="schedule" aria-label="Upcoming sessions"></section>
    </main>
  </body>
</html>
